name: Android Tests

on:
  push:
    branches: [ "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # ⏱️ límite de tiempo por seguridad

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Appium
        run: npm install -g appium

      - name: Start Appium server
        run: |
          appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
          sleep 10

      - name: Run Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86
          profile: pixel
          script: ./gradlew clean test -Dcucumber.filter.tags="@LoginCorrecto"

      - name: Shutdown emulator safely
        if: always()
        run: adb -s emulator-5554 emu kill